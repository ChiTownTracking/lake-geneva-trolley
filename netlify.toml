# Netlify build settings. Forms are detected from the prerendered HTML in dist/
# (each <form> carries data-netlify="true", a hidden form-name and a bot-field
# honeypot) - see HANDOFF.md, section 3.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires Node 22.12 or newer.
  NODE_VERSION = "22"

# Astro fingerprints these files; each changed asset gets a new URL.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
